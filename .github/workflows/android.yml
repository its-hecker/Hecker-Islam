name: Android
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and SDK 35
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests, lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Confirm the APK is truly standalone
        id: content
        shell: bash
        run: |
          if python3 tools/bundle_reference_assets.py --verify; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Standalone APK not published: required offline catalogs are missing from Git. Embed the authorized reference data and push it first."
          fi
      - uses: actions/upload-artifact@v4
        if: success() && steps.content.outputs.ready == 'true'
        with:
          name: hecker-islam-standalone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
