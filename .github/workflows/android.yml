name: Android
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Embed pinned Arabic muezzin recording (Nizar Al-Qatari)
        run: python3 tools/fetch_azaan_audio.py
      - name: Verify muezzin recording exists in APK assets
        run: test -s app/src/main/assets/azaan/nizar_al_qatari.mp3
      - name: Bundle full Shia Urdu Qur'an translations (Jawadi and Najafi)
        run: python3 tools/fetch_shia_quran_translations.py
      - name: Verify bundled offline catalogs
        run: |
          python3 tools/bundle_reference_assets.py --verify
          python3 tools/verify_daily_ziaraat.py
          python3 -c "import json,pathlib; p=pathlib.Path('app/src/main/assets/reference/quran'); assert all(len(json.loads((p/name).read_text(encoding='utf-8')))==6236 for name in ['ur_jawadi.json','ur_najafi.json'])"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and SDK 35
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests, lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hecker-islam-standalone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
